# Nginx config for stay.dunghoang.com
# File: /etc/nginx/sites-available/stayos
# Enable: sudo ln -s /etc/nginx/sites-available/stayos /etc/nginx/sites-enabled/

# Upstream Next.js server
upstream stayos_app {
    server 127.0.0.1:3002;
    keepalive 64;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name stay.dunghoang.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stay.dunghoang.com;

    # SSL - Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/stay.dunghoang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stay.dunghoang.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Next.js static files - long cache
    location /_next/static/ {
        alias /home/apps/StayOS/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Public files
    location /public/ {
        alias /home/apps/StayOS/public/;
        expires 30d;
    }

    # SSE endpoint — needs long timeout, no buffering
    location /api/meta/sse {
        proxy_pass http://stayos_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Proxy to Next.js
    location / {
        proxy_pass http://stayos_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
