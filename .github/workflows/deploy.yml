name: 🚀 Deploy StayOS to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS (stayos.hoangtiendung.com)
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm install

      - name: 🏗️ Build Next.js (CI check)
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🚢 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 2018
          command_timeout: 15m
          script: |
            set -e
            echo "=== Deploying StayOS ==="
            cd /home/apps/StayOS

            git pull origin main

            # Clean install — xoa sach node_modules de tranh symlink .bin/next bi hong
            rm -rf node_modules .next
            npm install

            # Verify next binary exists before building
            if [ ! -f node_modules/.bin/next ]; then
              echo "ERROR: next binary missing after install"
              exit 1
            fi

            NODE_ENV=production npm run build

            pm2 restart stayos --update-env || pm2 start ecosystem.config.js
            pm2 save

            echo "=== Deploy complete ==="
            pm2 status
