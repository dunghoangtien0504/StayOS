name: 🚀 Deploy StayOS to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS (stay.dunghoang.com)
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm install

      - name: 🏗️ Build Next.js (CI check)
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🚢 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          GOCLAW_API_URL: ${{ secrets.GOCLAW_API_URL }}
          GOCLAW_API_KEY: ${{ secrets.GOCLAW_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 2018
          command_timeout: 15m
          envs: META_VERIFY_TOKEN,META_PAGE_ACCESS_TOKEN,META_APP_SECRET,META_PAGE_ID,GOCLAW_API_URL,GOCLAW_API_KEY
          script: |
            set -e
            echo "=== Deploying StayOS ==="
            cd /home/apps/StayOS

            git pull origin main

            # Inject Meta env vars into .env.local
            touch .env.local
            for key in META_VERIFY_TOKEN META_PAGE_ACCESS_TOKEN META_APP_SECRET META_PAGE_ID GOCLAW_API_URL GOCLAW_API_KEY; do
              val=$(eval echo \$$key)
              if [ -n "$val" ]; then
                sed -i "/^${key}=/d" .env.local
                echo "${key}=${val}" >> .env.local
              fi
            done

            # Install only if package.json changed or node_modules missing
            if [ ! -f node_modules/.bin/next ]; then
              npm install --legacy-peer-deps
            else
              npm install --legacy-peer-deps --prefer-offline
            fi

            # Only delete .next build output, never node_modules
            rm -rf .next

            NODE_ENV=production npm run build

            pm2 restart stayos --update-env || pm2 start ecosystem.config.js
            pm2 save

            echo "=== Deploy complete ==="
            pm2 status
