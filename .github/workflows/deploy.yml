name: 🚀 Deploy StayOS to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build check (GitHub runner)
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🏗️ Build Next.js
        run: npm run build
        env:
          NODE_ENV: production

      - name: ✅ Build success — trigger VPS webhook
        run: |
          echo "Build passed. VPS will pull and rebuild via webhook."
          curl -s -X POST "${{ secrets.VPS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"secret":"${{ secrets.VPS_WEBHOOK_SECRET }}"}' \
            || echo "Webhook call failed (VPS may pull manually)"
