name: 🚀 Deploy StayOS to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS (stay.dunghoang.com)
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm install

      - name: 🏗️ Build Next.js (CI check)
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🚢 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          GOCLAW_API_URL: ${{ secrets.GOCLAW_API_URL }}
          GOCLAW_API_KEY: ${{ secrets.GOCLAW_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 2018
          command_timeout: 15m
          envs: META_VERIFY_TOKEN,META_PAGE_ACCESS_TOKEN,META_APP_SECRET,META_PAGE_ID,GOCLAW_API_URL,GOCLAW_API_KEY
          script: |
            set -e
            echo "=== Deploying StayOS ==="
            cd /home/apps/StayOS

            # Reset any local changes (e.g. from manual edits) to avoid git pull conflicts
            git reset --hard
            git clean -fd --exclude='.env.local' --exclude='public/uploads/'
            git pull origin main

            # Inject Meta env vars into .env.local
            touch .env.local
            for key in META_VERIFY_TOKEN META_PAGE_ACCESS_TOKEN META_APP_SECRET META_PAGE_ID GOCLAW_API_URL GOCLAW_API_KEY; do
              val=$(eval echo \$$key)
              if [ -n "$val" ]; then
                sed -i "/^${key}=/d" .env.local
                echo "${key}=${val}" >> .env.local
              fi
            done

            # Clean stale rename staging dirs left by failed npm installs
            find node_modules -maxdepth 2 -name ".next-*" -type d -exec rm -rf {} + 2>/dev/null || true

            # Install; if it fails (often ENOTEMPTY on next/), nuke node_modules and retry clean
            if [ ! -f node_modules/.bin/next ]; then
              npm install --legacy-peer-deps || { echo "install failed, wiping node_modules and retrying"; rm -rf node_modules package-lock.json.tmp; npm install --legacy-peer-deps; }
            else
              npm install --legacy-peer-deps --prefer-offline || { echo "install failed, wiping node_modules and retrying"; rm -rf node_modules; npm install --legacy-peer-deps; }
            fi

            # Only delete .next build output, never node_modules
            rm -rf .next

            # Build; on failure (e.g. corrupt/incomplete node_modules) do a full clean reinstall and rebuild
            if ! NODE_ENV=production npm run build; then
              echo "=== Build failed — wiping node_modules and doing clean reinstall ==="
              rm -rf node_modules .next
              npm install --legacy-peer-deps
              NODE_ENV=production npm run build
            fi

            # Delete + start (not restart) so PM2 always picks up latest ecosystem.config.js
            pm2 delete stayos 2>/dev/null || true
            pm2 start ecosystem.config.js

            # Ensure PM2 auto-starts on reboot
            pm2 startup systemd -u root --hp /root 2>/dev/null | grep "sudo env PATH" | bash 2>/dev/null || true
            pm2 save

            # Always sync nginx config, ensure symlink, test and reload
            cp deploy/nginx.conf /etc/nginx/sites-available/stayos
            ln -sf /etc/nginx/sites-available/stayos /etc/nginx/sites-enabled/stayos
            rm -f /etc/nginx/sites-enabled/default
            nginx -t && systemctl reload nginx
            echo "=== Nginx config synced and reloaded ==="

            echo "=== Deploy complete ==="
            pm2 status

            # ---- DEBUG: write everything to /tmp/debug.txt then cat at end ----
            set +e
            DBG=/tmp/stayos_debug.txt
            : > $DBG

            echo "=== Wait 8s for Next.js to boot ===" >> $DBG
            sleep 8

            echo "=== PM2 describe stayos ===" >> $DBG
            pm2 describe stayos >> $DBG 2>&1

            echo "=== PM2 logs stayos (last 40 lines) ===" >> $DBG
            pm2 logs stayos --lines 40 --nostream >> $DBG 2>&1

            echo "=== Port listeners (3000/80/443) ===" >> $DBG
            ss -tlnp 2>&1 | grep -E ':(3000|80|443)\b' >> $DBG || echo "no listeners matched" >> $DBG

            echo "=== Health check http://127.0.0.1:3000 ===" >> $DBG
            curl -sS -o /dev/null -w "HTTP %{http_code}\n" -m 10 http://127.0.0.1:3000/ >> $DBG 2>&1 || echo "curl failed" >> $DBG

            echo "=== Nginx status ===" >> $DBG
            systemctl status nginx --no-pager --lines 10 >> $DBG 2>&1

            echo "=== Nginx error log tail ===" >> $DBG
            tail -n 30 /var/log/nginx/error.log >> $DBG 2>&1

            echo "=== sites-enabled listing ===" >> $DBG
            ls -la /etc/nginx/sites-enabled/ >> $DBG 2>&1

            echo "=== active nginx server_name / upstream ===" >> $DBG
            grep -RhE "server_name|proxy_pass|upstream" /etc/nginx/ 2>/dev/null | grep -v "^#" >> $DBG

            echo ""
            echo "########## DEBUG OUTPUT ##########"
            cat $DBG
            echo "########## END DEBUG ##########"
            set -e
