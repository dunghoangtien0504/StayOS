name: 🚀 Deploy StayOS to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS (stay.dunghoang.com)
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm install

      - name: 🏗️ Build Next.js (CI check)
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: 🚢 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          GOCLAW_API_URL: ${{ secrets.GOCLAW_API_URL }}
          GOCLAW_API_KEY: ${{ secrets.GOCLAW_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 2018
          command_timeout: 15m
          envs: META_VERIFY_TOKEN,META_PAGE_ACCESS_TOKEN,META_APP_SECRET,META_PAGE_ID,GOCLAW_API_URL,GOCLAW_API_KEY,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY
          script: |
            set -e
            echo "=== Deploying StayOS ==="
            cd /home/apps/StayOS

            # Reset any local changes (e.g. from manual edits) to avoid git pull conflicts
            git reset --hard
            git clean -fd --exclude='.env.local' --exclude='public/uploads/'
            git pull origin main

            # Inject Meta env vars into .env.local
            touch .env.local
            for key in META_VERIFY_TOKEN META_PAGE_ACCESS_TOKEN META_APP_SECRET META_PAGE_ID GOCLAW_API_URL GOCLAW_API_KEY NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
              val=$(eval echo \$$key)
              if [ -n "$val" ]; then
                sed -i "/^${key}=/d" .env.local
                echo "${key}=${val}" >> .env.local
              fi
            done

            # Clean stale rename staging dirs left by failed npm installs
            find node_modules -maxdepth 2 -name ".next-*" -type d -exec rm -rf {} + 2>/dev/null || true

            # Install; if it fails (often ENOTEMPTY on next/), nuke node_modules and retry clean
            if [ ! -f node_modules/.bin/next ]; then
              npm install --legacy-peer-deps || { echo "install failed, wiping node_modules and retrying"; rm -rf node_modules package-lock.json.tmp; npm install --legacy-peer-deps; }
            else
              npm install --legacy-peer-deps --prefer-offline || { echo "install failed, wiping node_modules and retrying"; rm -rf node_modules; npm install --legacy-peer-deps; }
            fi

            # Only delete .next build output, never node_modules
            rm -rf .next

            # Build; on failure (e.g. corrupt/incomplete node_modules) do a full clean reinstall and rebuild
            if ! NODE_ENV=production npm run build; then
              echo "=== Build failed — wiping node_modules and doing clean reinstall ==="
              rm -rf node_modules .next
              npm install --legacy-peer-deps
              NODE_ENV=production npm run build
            fi

            # Delete + start (not restart) so PM2 always picks up latest ecosystem.config.js
            pm2 delete stayos 2>/dev/null || true
            pm2 start ecosystem.config.js

            # Ensure PM2 auto-starts on reboot
            pm2 startup systemd -u root --hp /root 2>/dev/null | grep "sudo env PATH" | bash 2>/dev/null || true
            pm2 save

            # Always sync nginx config, ensure symlink, test and reload
            cp deploy/nginx.conf /etc/nginx/sites-available/stayos
            ln -sf /etc/nginx/sites-available/stayos /etc/nginx/sites-enabled/stayos
            rm -f /etc/nginx/sites-enabled/default
            nginx -t && systemctl reload nginx
            echo "=== Nginx config synced and reloaded ==="

            # Health check: fail the deploy if the app is not actually serving.
            # Retry up to 10 times (Next.js needs a few seconds to boot).
            echo "=== Health check ==="
            ok=""
            for i in $(seq 1 10); do
              sleep 3
              code=$(curl -sS -o /dev/null -w "%{http_code}" -m 10 http://127.0.0.1:3000/ 2>/dev/null || echo 000)
              echo "attempt $i: HTTP $code"
              if [ "$code" = "200" ] || [ "$code" = "307" ] || [ "$code" = "302" ]; then ok=1; break; fi
            done
            if [ -z "$ok" ]; then
              echo "!!! Health check FAILED — app is not responding on :3000"
              pm2 describe stayos || true
              pm2 logs stayos --lines 40 --nostream || true
              exit 1
            fi

            echo "=== Deploy complete — app is healthy ==="
            pm2 status
